<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrum of Azeroth — interactive demo</title>
<meta name="description" content="Interactive browser demo of the windows of Scrum of Azeroth, a World of Warcraft add-on by DinX. Fictional progress data.">
<meta name="author" content="DinX">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 14 14%27%3E%3Crect width=%2714%27 height=%2714%27 fill=%27%23101216%27/%3E%3Cpath d=%27M3 8.5L7 4.5l4 4%27 fill=%27none%27 stroke=%27%233fc7eb%27 stroke-width=%272%27/%3E%3Cpath d=%27M3 12L7 8l4 4%27 fill=%27none%27 stroke=%27%23ffd100%27 stroke-width=%272%27/%3E%3C/svg%3E">
<style>
:root{
  --page:#0b0c0f; --bg:#101216; --head:#181b21; --card:#15181e; --card2:#1a1e25; --well:#0c0e12;
  --edge:#29303d; --gold:#ffd100; --acc:#3fc7eb; --mut:#8a93a0; --txt:#e6eaef; --green:#4fbf5a;
  --red:#e05050; --xp:#c9a227; --orange:#e8a33d; --violet:#a07ce0;
  --fs:13px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--txt);font:var(--fs)/1.35 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
.o,.wt,.colh,.ctitle,.trow .tt{text-shadow:1px 1px 0 #000}
a{color:var(--acc)}
svg{display:block}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--head);border-bottom:1px solid #000;flex-wrap:wrap;position:relative;z-index:5000}
#top h1{margin:0;font-size:15px;color:var(--gold);font-weight:600;white-space:nowrap;text-shadow:1px 1px 0 #000}
#top .by{color:var(--mut);font-size:12px}
#top .sp{flex:1}
.logo{width:22px;height:22px;background:#0f1d24;border:1px solid #000;display:grid;place-items:center}
.seg{display:inline-flex;border:1px solid #000}
.seg button{border:0;border-right:1px solid #000;background:var(--card);padding:2px 8px;height:22px;cursor:pointer;color:var(--mut)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{color:var(--acc);background:#132029}
/* ---------- buttons, inputs ---------- */
.btn{background:var(--card);border:1px solid #000;color:var(--txt);font-size:12px;padding:0 8px;height:22px;line-height:20px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover,.btn:focus-visible,.seg button:focus-visible{border-color:var(--acc);outline:none}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn.pri{color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default;border-color:#000}
.btn.ib{width:22px;padding:0;justify-content:center}
.btn.sm{height:18px;line-height:16px;font-size:11px;padding:0 6px}
select,input[type=text],input[type=number]{background:var(--well);border:1px solid #000;color:var(--txt);height:22px;padding:0 4px;font-size:12px;border-radius:0}
select:focus,input:focus{outline:none;border-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;margin:0}
label{cursor:pointer}
/* ---------- desk + windows ---------- */
#desk{position:relative;flex:1;min-height:calc(100vh - 70px)}
.win{position:absolute;background:var(--bg);border:1px solid #000;display:none;flex-direction:column;min-width:220px;min-height:60px}
.win.open{display:flex}
.wh{flex:0 0 auto;height:26px;background:var(--head);display:flex;align-items:center;gap:4px;padding:0 3px 0 8px;border-bottom:1px solid #000;cursor:move;user-select:none;touch-action:none}
.wt{color:var(--gold);font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt small{color:var(--mut);font-weight:400;margin-left:6px;font-size:11px}
.wb{flex:1;min-height:0;overflow:auto;position:relative}
.win:focus{outline:none}
.win.top .wh{background:#1c2028}
.muted{color:var(--mut)}
.gold{color:var(--gold)}
.green{color:var(--green)}
.red{color:var(--red)}
.acc{color:var(--acc)}
.xpc{color:var(--xp)}
.hint{color:var(--mut);font-size:11px}
/* ---------- tracker ---------- */
#w-tracker{width:290px;height:440px}
#w-tracker .wh{height:auto;min-height:26px;flex-wrap:wrap;padding:3px 3px 3px 8px}
#w-tracker .sline{flex:1;color:var(--gold);font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:move}
#w-tracker .sub{display:flex;align-items:center;gap:6px;width:100%;padding:2px 0 0}
#w-tracker .sub select{flex:1;min-width:0;height:20px;font-size:11px}
#w-tracker .via{font-size:10px;color:var(--acc);white-space:nowrap}
#w-tracker.folded{height:auto!important}
#w-tracker.folded .wb,#w-tracker.folded .tfoot{display:none}
.trk{zoom:var(--sc,1);padding:3px 0 6px}
.tgrp{display:flex;align-items:center;gap:6px;padding:3px 6px 2px;cursor:pointer;user-select:none}
.tgrp .gn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tgrp .gc{margin-left:auto;font-size:10px;color:var(--mut)}
.tgrp .gbar{height:2px;background:#22262e;flex:0 0 40px;position:relative}
.tgrp .gbar i{position:absolute;inset:0 auto 0 0;background:currentColor}
.trow{display:grid;grid-template-columns:14px 1fr auto;column-gap:5px;padding:2px 6px 3px 8px;cursor:pointer;border-left:2px solid transparent}
.trow:hover{background:#171b22;border-left-color:var(--acc)}
.trow.sel{background:#14202a}
.trow .tt{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .te{font-size:11px;color:var(--mut);white-space:nowrap;text-align:right}
.trow .tobj{grid-column:2/4;font-size:11px;color:#c3c9d1;display:flex;align-items:center;gap:4px;min-width:0}
.trow .tobj span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tobj.ok{color:var(--mut)}
.trow .tobj.ok::before{content:"\2713";color:var(--green);font-size:10px}
.trow .tmeta{grid-column:2/4;display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
.qitem{flex:0 0 auto;width:24px;height:24px;border:1px solid #000;outline:1px solid #8a7432;background:#1d1a12;cursor:pointer;display:grid;place-items:center;position:relative;margin:1px 0 1px auto;padding:0}
.qitem:hover{outline-color:var(--gold)}
.qitem.cd::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);animation:cd 1.2s linear forwards}
@keyframes cd{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(100% 0 0 0)}}
.tfoot{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:3px 18px 3px 8px;border-top:1px solid #000;background:var(--head);font-size:11px;color:var(--mut);position:relative}
.tfoot input{flex:1;min-width:40px}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 50%,#4b5462 50% 56%,transparent 56% 66%,#4b5462 66% 72%,transparent 72% 82%,#4b5462 82% 88%,transparent 88%)}
.grip:hover{background:linear-gradient(135deg,transparent 0 50%,var(--acc) 50% 56%,transparent 56% 66%,var(--acc) 66% 72%,transparent 72% 82%,var(--acc) 82% 88%,transparent 88%)}
/* ---------- badges, chevrons, pills ---------- */
.chev{display:inline-block;vertical-align:middle;flex:0 0 auto}
.badge{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-size:10px;padding:0 4px;border:1px solid currentColor;line-height:14px;white-space:nowrap;background:rgba(0,0,0,.25)}
.badge svg,td svg:not(.chev),.tt svg{display:inline-block;vertical-align:-1px;margin-right:2px}
.b-block{color:var(--red)} .b-hold{color:var(--orange)} .b-up{color:var(--green)} .b-turn{color:var(--gold)} .b-share{color:var(--acc)} .b-resume{color:var(--green)} .b-group{color:#d08cf0} .b-demo{color:var(--mut)}
.pill{display:inline-block;font-size:10px;padding:0 5px;line-height:15px;border:1px solid #000;color:#0b0c0f;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.etag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{display:inline-block;vertical-align:-2px;color:var(--acc)}
/* ---------- board ---------- */
#w-board{width:1000px;height:640px}
.btool{display:flex;align-items:center;gap:6px;padding:5px 6px;border-bottom:1px solid #000;background:#13161b;flex-wrap:wrap}
.btool [role=tablist]{display:inline-flex;gap:0}
.btool [role=tab]{margin-right:-1px}
.btool .sp{flex:1}
.bbody{display:flex;flex:1;min-height:0}
.bmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.bview{flex:1;min-height:0;overflow:auto;padding:6px}
.bfoot{flex:0 0 auto;font-size:10px;color:var(--mut);padding:2px 8px;border-top:1px solid #000;display:flex;gap:10px;background:#0e1014}
.bfoot .sp{flex:1}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,1fr);gap:6px;height:100%;min-height:300px}
.col{background:var(--well);border:1px solid #000;display:flex;flex-direction:column;min-height:0}
.colh{display:flex;align-items:center;gap:6px;padding:4px 6px;font-weight:600;font-size:12px;border-bottom:1px solid #000;background:#14171c}
.colh .cnt{margin-left:auto;color:var(--mut);font-weight:400;font-size:11px}
.colh i{width:8px;height:8px;display:inline-block;border:1px solid #000}
.colb{flex:1;overflow:auto;padding:5px;min-height:40px}
.lane{font-size:10px;color:var(--orange);text-transform:uppercase;letter-spacing:.05em;border-top:1px dashed #3a3220;margin:8px 0 4px;padding-top:4px}
.card{background:var(--card);border:1px solid #000;border-left:3px solid var(--ec,#555);padding:4px 6px 5px;margin-bottom:5px;cursor:pointer;position:relative}
.card:hover{border-color:#3a4a58;border-left-color:var(--ec)}
.card:focus-visible{outline:1px solid var(--acc)}
.card.sel{border-color:var(--acc);border-left-color:var(--ec)}
.card.done{opacity:.5}
.card.prop{border-color:var(--gold);border-left-color:var(--ec)}
.c1{display:flex;align-items:center;gap:5px;min-width:0}
.c1 .etag{flex:1;min-width:0}
.c1 .cxp{font-size:10px;color:var(--xp);white-space:nowrap}
.cm{border:0;background:none;color:var(--mut);cursor:pointer;padding:0 2px;font-size:13px;line-height:12px;height:14px}
.cm:hover,.cm:focus-visible{color:var(--acc);outline:none}
.ctitle{font-weight:600;font-size:12.5px;margin:2px 0 1px;line-height:1.25}
.ctitle .lv{font-weight:400;font-size:10px;color:var(--mut);margin-left:3px}
.cest{font-size:11px;color:var(--mut)}
.badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chk{list-style:none;margin:4px 0 0;padding:0;font-size:11px;color:#c6ccd4}
.chk li{display:flex;gap:5px;align-items:baseline}
.chk li::before{content:"\25A1";color:var(--mut);font-size:10px;flex:0 0 auto}
.chk li.ok{color:var(--mut)}
.chk li.ok::before{content:"\2713";color:var(--green)}
.chk li .pc{margin-left:auto;color:var(--mut);white-space:nowrap}
.combo{border:1px dashed #2f6578;padding:4px;margin-bottom:6px;background:#0f161a}
.combo .ch{font-size:10px;color:var(--acc);display:flex;align-items:center;gap:4px;margin:0 0 4px}
.combo .card{margin-bottom:4px}
.combo .card:last-child{margin-bottom:0}
/* scrum */
.strip{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:8px;background:var(--well);border:1px solid #000;padding:6px 8px;margin-bottom:6px}
.strip .goal{display:flex;gap:6px;align-items:center}
.strip .goal input{flex:1;min-width:0;color:var(--gold)}
.strip .nums{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px;font-size:12px}
.strip .nums b{font-weight:600}
.cap{height:8px;background:#1d2128;border:1px solid #000;position:relative;margin:2px 0 4px}
.cap i{position:absolute;top:0;bottom:0;left:0;background:var(--acc)}
.cap i.dv{background:var(--green)}
.cap i.ov{background:var(--red)}
.fc{font-size:11.5px;color:#cfd5dc}
.fc .xpc{font-weight:600}
.burn{background:#0a0b0e;border:1px solid #000}
.burn text{fill:var(--mut);font-size:9px}
.sbtn{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.prop-box{border:1px solid var(--gold);background:#17150c;padding:6px 8px;margin-bottom:6px}
.prop-box ul{margin:4px 0 6px;padding-left:18px}
.scr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.pane{background:var(--well);border:1px solid #000;min-height:0}
.pane > h3{margin:0;font-size:12px;padding:4px 6px;background:#14171c;border-bottom:1px solid #000;display:flex;gap:6px;align-items:center}
.pane > h3 .cnt{margin-left:auto;color:var(--mut);font-weight:400;font-size:11px}
.pane .pb{padding:5px}
.grp{margin-bottom:4px}
.grph{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--acc);padding:3px 2px;cursor:pointer;user-select:none;border:0;background:none;width:100%;text-align:left}
.grph .cnt{margin-left:auto;color:var(--mut);font-weight:400}
.srow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;align-items:center;gap:6px;padding:3px 5px;background:var(--card);border:1px solid #000;border-left:3px solid var(--ec,#555);margin-bottom:3px;cursor:pointer;font-size:12px}
.srow:hover{border-color:#3a4a58;border-left-color:var(--ec)}
.srow.sel{border-color:var(--acc);border-left-color:var(--ec)}
.srow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.srow .nm small{font-weight:400;color:var(--mut);margin-left:4px}
.srow .es{font-size:11px;color:var(--mut);white-space:nowrap}
.srow.grey{opacity:.55}
.srow.done .nm{text-decoration:line-through;color:var(--mut)!important}
/* list */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:-6px;background:#14171c;text-align:left;font-weight:600;color:var(--mut);padding:4px 6px;border-bottom:1px solid #000;white-space:nowrap;z-index:1}
.tbl th button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;display:inline-flex;gap:3px;align-items:center}
.tbl th button:hover,.tbl th button:focus-visible{color:var(--acc);outline:none}
.tbl th[aria-sort=ascending] button,.tbl th[aria-sort=descending] button{color:var(--gold)}
.tbl td{padding:3px 6px;border-bottom:1px solid #1a1d23;white-space:nowrap}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:#151a21}
.tbl tr.r.sel td{background:#13212b}
.tbl tr.gh td{background:#0d0f13;color:var(--gold);font-weight:600;font-size:11px;padding-top:6px;border-bottom:1px solid #000}
.tbl .qn{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.pbar{height:6px;width:70px;background:#1d2128;border:1px solid #000;position:relative;display:inline-block;vertical-align:middle}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.tblw{overflow-x:auto}
/* detail */
.detail{flex:0 0 330px;width:330px;border-left:1px solid #000;background:#0e1014;display:flex;flex-direction:column;min-height:0}
.dh{padding:6px 8px;border-bottom:1px solid #000;background:#13161b}
.dh .dt{font-size:14px;font-weight:600;margin:2px 0;display:flex;gap:6px;align-items:flex-start}
.dh .dt span{flex:1}
.dh .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px}
.dtabs{display:flex;border-bottom:1px solid #000;background:#121419}
.dtabs [role=tab]{flex:1;border:0;border-right:1px solid #000;background:none;color:var(--mut);height:24px;cursor:pointer;font-size:12px}
.dtabs [role=tab]:last-child{border-right:0}
.dtabs [role=tab][aria-selected=true]{color:var(--gold);background:var(--bg);box-shadow:inset 0 -2px 0 var(--gold)}
.dtabs [role=tab]:focus-visible{outline:1px solid var(--acc)}
.dbody{flex:1;overflow:auto;padding:6px 8px 10px}
.sec{margin:8px 0 3px;font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
.desc{color:#d5dae0;font-size:12px;margin:2px 0 4px}
.obj{margin-bottom:6px}
.obj .on{display:flex;justify-content:space-between;font-size:12px}
.obj .bar{height:6px;background:#1d2128;border:1px solid #000;position:relative;margin:2px 0}
.obj .bar i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.obj.ok .bar i{background:var(--green)}
.obj .nt{font-size:10.5px;color:var(--mut)}
.note{border:1px solid #000;border-left:3px solid var(--orange);background:#16130d;padding:4px 6px;font-size:11.5px;margin:6px 0}
.note.red{border-left-color:var(--red);background:#1a0f10;color:#e9c9c9}
.note.grn{border-left-color:var(--green);background:#0f1810;color:#cfe9cf}
.rew{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.item{width:38px;height:38px;border:2px solid var(--q,#fff);background:#0b0c0f;display:grid;place-items:center;position:relative;cursor:help;outline:1px solid #000}
.item .up{position:absolute;right:-4px;top:-5px;background:var(--green);color:#000;font-size:9px;font-weight:700;padding:0 2px;line-height:11px;border:1px solid #000}
.item .ct{position:absolute;right:1px;bottom:0;font-size:10px;font-weight:700;text-shadow:1px 1px 0 #000}
.money{display:inline-flex;gap:5px;align-items:center}
.coin{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid #000;margin-left:1px;vertical-align:-1px}
.coin.g{background:#ffd34d}.coin.s{background:#c7ccd4}.coin.c{background:#c27a3e}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:6px;align-items:baseline;padding:2px 3px;cursor:pointer;font-size:12px}
.steps li:hover{background:#171b22}
.steps li .m{width:12px;text-align:center;flex:0 0 auto}
.steps li.d{color:var(--mut)} .steps li.d .m{color:var(--green)}
.steps li.c{color:var(--acc);font-weight:600}
.steps li.u{color:#77808c}
.steps li.cur{background:#14202a}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stat{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px;align-items:center}
.stat .v{text-align:right;font-weight:600}
.eff{height:10px;background:#1d2128;border:1px solid #000;position:relative;margin:4px 0}
.eff i{position:absolute;inset:0 auto 0 0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid #2a303a;margin-left:5px}
.tl li{position:relative;padding:2px 0 5px 6px;font-size:11.5px}
.tl li::before{content:"";position:absolute;left:-19px;top:6px;width:7px;height:7px;background:var(--dc,#555);border:1px solid #000}
.tl li .tm{color:var(--mut);font-size:10px;margin-right:5px;font-variant-numeric:tabular-nums}
.tl li.fight{cursor:context-menu}
.tl li.fight:hover{background:#171b22}
.sig{display:inline-flex;gap:1px;align-items:flex-end;height:9px;margin-right:3px;vertical-align:0}
.sig i{width:2px;background:#39414d}
.sig i.on{background:var(--acc)}
.dempty{padding:20px;color:var(--mut);text-align:center}
/* flow */
#w-flow{width:780px;height:500px}
.ftool{display:flex;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px solid #000;background:#13161b;flex-wrap:wrap}
.ftool .sp{flex:1}
.legend{display:flex;gap:8px;font-size:10px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border:1px solid;vertical-align:-1px;margin-right:3px}
.fwrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#0a0b0e;background-image:linear-gradient(#11141a 1px,transparent 1px),linear-gradient(90deg,#11141a 1px,transparent 1px);background-size:24px 24px}
#fsvg{width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#fsvg.drag{cursor:grabbing}
#fsvg .node{cursor:pointer}
#fsvg .node:hover rect,#fsvg .node:hover polygon{stroke:var(--acc)}
#fsvg text{font-family:inherit}
.mini{position:absolute;right:6px;bottom:6px;width:150px;height:96px;background:rgba(10,11,14,.92);border:1px solid #000;outline:1px solid #2a303a;cursor:pointer}
.fzoom{position:absolute;left:6px;bottom:6px;font-size:10px;color:var(--mut);background:rgba(10,11,14,.85);padding:1px 5px;border:1px solid #000}
/* review */
#w-review{width:580px;height:560px}
.rv{padding:8px 10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:6px 0}
.kpi{background:var(--well);border:1px solid #000;padding:5px 7px}
.kpi .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:16px;font-weight:600;margin-top:1px}
.split{display:flex;height:12px;border:1px solid #000;margin:4px 0 2px}
.split i{display:block;height:100%}
.box{background:var(--well);border:1px solid #000;padding:6px 8px;margin-top:8px}
.box h4{margin:0 0 4px;font-size:12px;color:var(--gold)}
.vel text{fill:var(--mut);font-size:9px}
/* settings */
#w-settings{width:400px;height:560px}
.set{padding:6px 10px 10px}
.srow2{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #191c22;font-size:12px}
.srow2 .sl small{display:block;color:var(--mut);font-size:10.5px}
.srow2 select,.srow2 input[type=number]{width:100%}
.srow2 .ctl{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.srow2 .ctl input[type=range]{flex:1;min-width:0}
.sethd{color:var(--gold);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px}
/* simulate panel */
#w-sim{width:290px;height:auto}
#w-sim .wh{background:repeating-linear-gradient(135deg,#1d1a10 0 8px,#181b21 8px 16px)}
#w-sim .wt{color:#e2d39a}
.sim{padding:6px 8px 8px}
.sim .tag{font-size:10.5px;color:var(--mut);margin-bottom:6px}
.sim .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sim .grid .btn{justify-content:center}
.sim .tg{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12px}
.sim .tg label{display:flex;gap:6px;align-items:center}
.sim .st{font-size:11px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.xpbar{height:5px;background:#1d2128;border:1px solid #000;position:relative;margin-top:3px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--xp)}
/* overlays */
#toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:4px;z-index:9000;pointer-events:none;width:min(420px,calc(100vw - 32px))}
.toast{background:#12151a;border:1px solid #000;border-left:3px solid var(--tc,var(--acc));padding:5px 9px;font-size:12.5px;animation:tin .18s ease-out;pointer-events:auto}
.toast b{color:var(--gold);font-weight:600}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
#ctx{position:fixed;z-index:9500;background:#111318;border:1px solid #000;outline:1px solid #2a303a;min-width:170px;padding:3px 0;display:none}
#ctx.open{display:block}
#ctx .mh{font-size:11px;color:var(--gold);padding:3px 10px 4px;border-bottom:1px solid #000;margin-bottom:2px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx button{display:flex;width:100%;align-items:center;gap:6px;background:none;border:0;color:var(--txt);text-align:left;padding:3px 10px;cursor:pointer;font-size:12px}
#ctx button:hover,#ctx button:focus{background:#1b2630;color:var(--acc);outline:none}
#ctx button .ar{margin-left:auto;color:var(--mut)}
#ctx button.cur{color:var(--gold)}
#ctx hr{border:0;border-top:1px solid #000;margin:2px 0}
#tip{position:fixed;z-index:9600;background:#0d0f14;border:1px solid #000;outline:1px solid #39404c;padding:6px 8px;font-size:12px;max-width:260px;pointer-events:none;display:none}
#tip .tn{font-weight:600;font-size:13px}
#tip .ts{color:var(--mut)}
#dlgbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9400;display:none;place-items:center;padding:16px}
#dlgbg.open{display:grid}
#dlg{background:var(--bg);border:1px solid #000;width:min(380px,100%)}
#dlg .f{padding:8px 10px;display:grid;gap:8px}
#dlg label{display:grid;gap:3px;font-size:12px;color:var(--mut)}
#dlg input,#dlg textarea,#dlg select{width:100%}
#dlg textarea{background:var(--well);border:1px solid #000;color:var(--txt);font:inherit;font-size:12px;min-height:54px;padding:4px}
#dlg .ft{display:flex;justify-content:flex-end;gap:6px;padding:6px 10px;border-top:1px solid #000}
#dlg .err{color:var(--red);font-size:11px;min-height:14px}
footer{padding:8px 12px;font-size:11px;color:var(--mut);border-top:1px solid #000;background:#0d0e11;line-height:1.5}
footer b{color:#b8bfc8;font-weight:600}
#ptabs{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- phone ---------- */
body.phone #desk{min-height:0;padding:0 0 70px}
body.phone #ptabs{display:flex;position:sticky;top:0;z-index:4000;background:var(--head);border-bottom:1px solid #000;overflow-x:auto;scrollbar-width:none}
body.phone #ptabs button{flex:1 0 auto;background:none;border:0;border-right:1px solid #000;color:var(--mut);padding:8px 10px;font-size:12px;cursor:pointer}
body.phone #ptabs button[aria-selected=true]{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);background:#1c2028}
body.phone .win{position:static!important;width:auto!important;height:auto!important;display:none;margin:0;border-left:0;border-right:0;max-width:100vw}
body.phone .win.ptab-on{display:flex}
body.phone .wh{cursor:default}
body.phone #w-tracker .wb{max-height:none}
body.phone .grip{display:none}
body.phone .bbody{flex-direction:column}
body.phone .detail{flex:none;width:auto;border-left:0;border-bottom:1px solid #000;order:-1;max-height:none}
body.phone .dbody{overflow:visible}
body.phone .bview{overflow:visible}
body.phone .kan{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr;height:auto}
body.phone .colb{overflow:visible}
body.phone .strip{grid-template-columns:1fr}
body.phone .scr{grid-template-columns:1fr}
body.phone .fwrap{height:62vh;flex:none}
body.phone .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
body.phone #top h1{font-size:13px;white-space:normal}
body.phone .srow2{grid-template-columns:1fr 130px}
body.phone .btn{height:28px}
body.phone .btn.ib{width:28px}
body.phone select{height:28px}
body.phone .tbl .qn{max-width:150px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.qitem.cd::after{animation:none}}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let LANG = 'en';
const MISSING = new Set();
// T('Text %s', x): English text is the key, like the add-on's Locale.lua
function T(k, ...a) {
  let s = k;
  if (LANG === 'nl') { if (Object.prototype.hasOwnProperty.call(NL, k)) s = NL[k]; else MISSING.add(k); }
  let i = 0;
  return s.replace(/%%|%[sd]/g, m => { if (m === '%%') return '%'; const v = a[i++]; return v === undefined ? '' : v; });
}
const X = o => o == null ? '' : typeof o === 'string' ? o : (o[LANG] ?? o.en);
const num = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'nl' ? '.' : ',');
const dec = (n, d = 1) => n.toFixed(d).replace('.', LANG === 'nl' ? ',' : '.');
function mins(m) {
  m = Math.max(0, m); if (m < 1) return '<1 min';
  const r = Math.round(m); if (r < 60) return r + ' min';
  return Math.floor(r / 60) + (LANG === 'nl' ? 'u' : 'h') + String(r % 60).padStart(2, '0');
}
function money(c) {
  const g = Math.floor(c / 10000), s = Math.floor(c % 10000 / 100), k = c % 100, out = [];
  if (g) out.push(g + '<i class="coin g"></i>');
  if (s) out.push(s + '<i class="coin s"></i>');
  if (k || !out.length) out.push(k + '<i class="coin c"></i>');
  return '<span class="money">' + out.join(' ') + '</span>';
}
let rnd = Math.random;
function seed(n) { let a = n >>> 0; rnd = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  lsort(el) { const k = el.dataset.k; S.ui.lsort = { k, d: S.ui.lsort.k === k ? -S.ui.lsort.d : (k === 'quest' || k === 'epic' || k === 'status' || k === 'est' ? 1 : -1) }; renderBoard(); },
  useitem(el, e) {
    e.stopPropagation();
    if (el.classList.contains('qitem')) { if (el.classList.contains('cd')) return; }
    SIM.vial();
    const b = $(`.qitem[data-id="${el.dataset.id}"]`); if (b) { b.classList.add('cd'); }
  },
  sim(el) { SIM[el.dataset.v](); },
  tick(el) { const x = Q(el.dataset.id), i = +el.dataset.o; if (bump(x, i)) { afterProgress(x); after(); } },
  resume(el) { resume(Q(el.dataset.id)); },
  dact(el) {
    const x = Q(el.dataset.id), v = el.dataset.v, r = el.getBoundingClientRect();
    if (v === 'track') toast(T('Tracked: %s', '<b>' + esc(title(x)) + '</b>'), '#ffd100');
    if (v === 'map') toast(T('World map opened at %s', esc(x.zone)), '#c9a227');
    if (v === 'gps') shiftClick(x);
    if (v === 'log') toast(T('Opened in the quest log: %s', '<b>' + esc(title(x)) + '</b>'), '#8a93a0');
    if (v === 'hold') { ticketMenu(x, r.left, r.bottom + 2); MENU[1].fn(); }
    if (v === 'move') { ticketMenu(x, r.left, r.bottom + 2); MENU[2].fn(); }
  },
  newticket() { ticketDialog(); },
  dlgclose() { $('#dlgbg').classList.remove('open'); },
  dlgsave() { saveTicket(); },
  flowfit() { fitFlow(); },
  flowup() { S.ui.flowEpic = 'init'; renderFlow(); },
  ptab(el) { const v = el.dataset.v; S.ui.ptab = v; if (!['tracker', 'sim'].includes(v)) S.open[v] = true; renderTabs(); render(); window.scrollTo(0, 0); },
  resetest() { for (const x of S.tickets) { x.spread = 0.32; x.kills = 0; x.drops = 0; } toast(T('Learned estimates reset: defaults are used again.')); render(); },
  reimport() { toast(T('History imported: %s completed quests, %d statistics, played time requested.', num(186), 52)); },
  ck(el) { S.ck = el.checked; toast(S.ck ? T('CasterKit loaded: the tracker shows “via CasterKit”.') : T('CasterKit removed.'), '#3fc7eb'); render(); },
  roa(el) { S.roa = el.checked; toast(S.roa ? T('Roads of Azeroth loaded: smart route sorting and GPS stops.') : T('Roads of Azeroth removed.'), '#3fc7eb'); render(); },
};
function initEvents() {
  document.addEventListener('click', e => {
    const m = $('#ctx');
    if (m.classList.contains('open')) {
      const b = e.target.closest('#ctx button');
      if (b) { const it = MENU[+b.dataset.i]; if (!it.keep) hideMenu(); it.fn(); return; }
      if (!e.target.closest('#ctx')) hideMenu();
    }
    if (e.target.matches('input[type=checkbox][data-act]')) { ACT[e.target.dataset.act](e.target, e); return; }
    const a = e.target.closest('[data-act]');
    if (a && ACT[a.dataset.act] && !(a.disabled)) { if (a.tagName === 'INPUT') return; ACT[a.dataset.act](a, e); }
    if (e.target.id === 'dlgbg') $('#dlgbg').classList.remove('open');
  });
  document.addEventListener('contextmenu', e => {
    const f = e.target.closest('[data-fight]');
    if (f) { e.preventDefault(); fightMenu(Q(f.dataset.id), +f.dataset.fight, e.clientX, e.clientY); return; }
    const c = e.target.closest('#w-board [data-id], #w-tracker [data-id]');
    if (c && Q(c.dataset.id)) { e.preventDefault(); ticketMenu(Q(c.dataset.id), e.clientX, e.clientY); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'tSort') { S.set.sort = t.value; render(); return; }
    if (t.id === 'bFilter') { S.ui.filter = t.value; renderBoard(); return; }
    if (t.id === 'lgroup') { S.ui.lgroup = t.value; renderBoard(); return; }
    if (t.id === 'fEpic') { S.ui.flowEpic = t.value; renderFlow(); return; }
    if (t.id === 'goal') { S.sprint.goalEdited = t.value; toast(T('Sprint goal saved.')); return; }
    const k = t.dataset.set; if (!k) return;
    if (k === 'lang') { setLang(t.value); return; }
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'cap') v = clamp(Math.round(+v || 60), 15, 240);
    if (k === 'scale') v = +v;
    S.set[k] = v;
    if (k === 'holdCol' || k === 'combo' || k === 'view') S.ui.proposal = null;
    if (k === 'toasts' && v) toast(T('Toasts on.'));
    render();
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'tScale' || t.dataset.set === 'scale') {
      S.set.scale = +t.value; $('#tBody').style.setProperty('--sc', S.set.scale / 100);
      $('#tScaleV').textContent = S.set.scale + '%'; const sv = $('#setScaleV'); if (sv) sv.textContent = S.set.scale + '%';
      if (t.id === 'tScale') { const s2 = $('#set-scale'); if (s2) s2.value = t.value; } else $('#tScale').value = t.value;
    }
  });
  document.addEventListener('keydown', e => {
    const tg = e.target, typing = tg.matches && tg.matches('input[type=text],input[type=number],textarea,select,[contenteditable]');
    if (e.key === 'Escape') {
      if ($('#ctx').classList.contains('open')) { hideMenu(); return; }
      if ($('#dlgbg').classList.contains('open')) { $('#dlgbg').classList.remove('open'); return; }
      hideTip();
      const w = topWin(); if (w) { closeWin(w); e.preventDefault(); }
      return;
    }
    if ((e.key === 'b' || e.key === 'B') && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { toggleWin('board'); e.preventDefault(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && tg.matches && tg.matches('[data-act][tabindex]:not(button)')) { e.preventDefault(); tg.click(); return; }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && tg.getAttribute && tg.getAttribute('role') === 'tab') {
      const tabs = [...tg.parentElement.querySelectorAll('[role=tab]')], i = tabs.indexOf(tg), n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
      n.click(); e.preventDefault();
    }
    if ($('#ctx').classList.contains('open') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const bs = $$('#ctx button:not([disabled])'), i = bs.indexOf(document.activeElement);
      bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); e.preventDefault();
    }
  });
  document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tiph]'); if (t) showTip(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tiph]')) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tiph]'); if (t) showTip(t); else hideTip(); });
  window.addEventListener('resize', () => { checkPhone(); deskHeight(); });
  $('#tSprint').addEventListener('click', () => openWin('board'));
}

// ---------- start ----------
initState('en');
initEvents();
initDrag();
initFlowInput();
checkPhone();
applyStatic();
$$('.win').forEach(w => w.classList.toggle('open', !!S.open[w.id.slice(2)] || PHONE));
if (!PHONE) defaultLayout();
S.ui.sel = 'band';
openWin('board');
if (PHONE) { S.ui.ptab = 'tracker'; renderTabs(); }
render();
// test hook for the Playwright checks (no effect on the demo)
window.SoA = { get S() { return S; }, Q, F, SIM, render, openWin, closeWin, setLang, missing: MISSING, fitFlow };
</script>
